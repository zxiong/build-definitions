---
# Test PipelineRuns for fbc-fips matrix tasks
# Apply these to test different edge case scenarios
#
# Usage:
#   kubectl apply -f test-pipelineruns.yaml
#
# Or run specific scenario:
#   kubectl apply -f - <<< $(yq 'select(.metadata.name == "test-fbc-fips-zero-images")' test-pipelineruns.yaml)

# ============================================
# Scenario 1: Zero images (no related images found)
# Expected: 1 bucket created, check task runs but no FIPS check needed
# ============================================
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: test-fbc-fips-zero-images-
  labels:
    test-scenario: zero-images
spec:
  pipelineSpec:
    tasks:
      - name: fbc-fips-prepare
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/konflux-ci/build-definitions
            - name: revision
              value: main  # Change to your branch
            - name: pathInRepo
              value: task/fbc-fips-prepare-oci-ta/0.1/fbc-fips-prepare-oci-ta-test.yaml
        params:
          - name: TEST_SCENARIO
            value: "zero-images"
          - name: NUM_BUCKETS
            value: "3"
          - name: ociStorage
            value: quay.io/your-repo/test-artifacts  # Change this

      - name: fbc-fips-check
        runAfter:
          - fbc-fips-prepare
        matrix:
          params:
            - name: BUCKET_INDEX
              value: $(tasks.fbc-fips-prepare.results.BUCKET_INDICES[*])
        taskRef:
          resolver: git
          params:
            - name: url
              value: https://github.com/konflux-ci/build-definitions
            - name: revision
              value: main  # Change to your branch
            - name: pathInRepo
              value: task/fbc-fips-check-matrix-based-oci-ta/0.1/fbc-fips-check-matrix-based-oci-ta.yaml
        params:
          - name: BUCKETS_ARTIFACT
            value: $(tasks.fbc-fips-prepare.results.BUCKETS_ARTIFACT)
          - name: MAX_PARALLEL
            value: "2"
---
